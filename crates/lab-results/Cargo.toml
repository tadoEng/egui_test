[package]
name = "lab-results"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
publish = false
description = "Read-only presentation of cached EtabExtension result DTOs (no recalculation)"

# Native only: ext-calc's async stack (tokio/mio) cannot target wasm32, and
# on wasm32 this crate is empty (see `lib.rs`).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ext-calc = { git = "https://github.com/tadoEng/EtabExtension", rev = "9eb1c8792a1d41f3f81c60428afe89f1655782ba" }
ext-core = { git = "https://github.com/tadoEng/EtabExtension", rev = "9eb1c8792a1d41f3f81c60428afe89f1655782ba" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
tempfile = "3.27.0"

[lints]
workspace = true
