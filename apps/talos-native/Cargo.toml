[package]
name = "talos-native"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
description = "Experimental TALOS native application shell (APP-01A): read-only, public synthetic data only"
publish = false

[dependencies]
eframe = "0.37.0"
egui = "0.37.0"
image = { version = "0.25.10", default-features = false, features = ["png"] }
lab-e2k-mesh = { path = "../../crates/lab-e2k-mesh" }
lab-viewport = { path = "../../crates/lab-viewport" }
log = "0.4.34"
web-time = "1.1.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "0.11.11"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
egui_kittest = { version = "0.37.0", features = ["eframe"] }

[lints]
workspace = true
