[package]
name = "talos-native"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
description = "Experimental TALOS native application (APP-01): read-only; public fixtures or explicitly named version folders"
publish = false

# A desktop application: native only. On wasm32 the library is empty and the
# binary is a no-op (lab-results needs ext-calc, which cannot target wasm32).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
eframe = "0.37.0"
egui = "0.37.0"
image = { version = "0.25.10", default-features = false, features = ["png"] }
lab-e2k-mesh = { path = "../../crates/lab-e2k-mesh" }
lab-viewport = { path = "../../crates/lab-viewport" }
lab-results = { path = "../../crates/lab-results" }
log = "0.4.34"
web-time = "1.1.0"
env_logger = "0.11.11"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
egui_kittest = { version = "0.37.0", features = ["eframe"] }
serde_json = "1.0.145"
tempfile = "3.27.0"

[lints]
workspace = true
