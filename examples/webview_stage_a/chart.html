<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'none'; connect-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'"
  >
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    html, body, #chart { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { background: #121923; color: #d8e1ec; font: 13px system-ui, sans-serif; }
    #chart:focus-visible { outline: 2px solid #74d8c2; outline-offset: -3px; }
  </style>
</head>
<body>
  <div id="chart" tabindex="0" role="application" aria-label="Synthetic story drift chart"></div>
  <script>
    window.__stageError = null;
    window.addEventListener("error", event => { window.__stageError = event.message; });
  </script>
  <script>/*__ECHARTS_RUNTIME__*/</script>
  <script>
    (() => {
      "use strict";
      window.__stageMarker = "before_init";
      const rows = Object.freeze([
        Object.freeze({ story: 1, label: "Story 1", drift: 0.0014 }),
        Object.freeze({ story: 2, label: "Story 2", drift: 0.0022 }),
        Object.freeze({ story: 3, label: "Story 3", drift: 0.0031 }),
        Object.freeze({ story: 4, label: "Story 4", drift: 0.0042 }),
        Object.freeze({ story: 5, label: "Story 5", drift: 0.0036 }),
        Object.freeze({ story: 6, label: "Story 6", drift: 0.0025 })
      ]);
      const limit = 0.005;
      let selectedStory = 3;
      const element = document.getElementById("chart");
      const chart = echarts.init(element, null, { renderer: "canvas" });
      window.__stageMarker = "after_init";

      function selectedPoint(story) {
        const row = rows[story - 1];
        return [{ value: [row.drift, row.label], story: row.story }];
      }

      chart.setOption({
        animationDuration: 180,
        backgroundColor: "#121923",
        title: {
          text: "Synthetic story drift",
          subtext: "SYNTH_DBE_X · drift ratio · limit 0.005",
          left: 18,
          top: 10,
          textStyle: { color: "#eef4fb", fontSize: 16 },
          subtextStyle: { color: "#9eafc2", fontSize: 11 }
        },
        grid: { left: 84, right: 50, top: 78, bottom: 64 },
        tooltip: {
          trigger: "item",
          formatter: (params) => {
            const row = rows[params.data.story - 1];
            return `${row.label}<br>SYNTH_DBE_X: ${row.drift.toFixed(4)} drift ratio`;
          }
        },
        xAxis: {
          type: "value",
          name: "Drift ratio",
          min: 0,
          max: 0.006,
          axisLabel: { color: "#b9c6d5", formatter: (value) => value.toFixed(3) },
          nameTextStyle: { color: "#b9c6d5" },
          splitLine: { lineStyle: { color: "#2a3543" } }
        },
        yAxis: {
          type: "category",
          data: rows.map((row) => row.label),
          axisLabel: { color: "#b9c6d5" },
          axisLine: { lineStyle: { color: "#617185" } }
        },
        dataZoom: [
          { type: "inside", yAxisIndex: 0, filterMode: "none" },
          { type: "slider", yAxisIndex: 0, right: 8, width: 18, filterMode: "none" }
        ],
        series: [
          {
            name: "SYNTH_DBE_X",
            type: "line",
            symbolSize: 9,
            data: rows.map((row) => ({ value: [row.drift, row.label], story: row.story })),
            lineStyle: { color: "#74d8c2", width: 3 },
            itemStyle: { color: "#74d8c2" },
            emphasis: { scale: 1.5 },
            markLine: {
              silent: true,
              symbol: "none",
              label: { color: "#ffb870", formatter: "Limit 0.005" },
              lineStyle: { color: "#ff9d57", width: 2, type: "dashed" },
              data: [{ xAxis: limit }]
            }
          },
          {
            name: "Selected story",
            type: "scatter",
            symbol: "diamond",
            symbolSize: 18,
            data: selectedPoint(selectedStory),
            itemStyle: { color: "#ffb158", borderColor: "#ffffff", borderWidth: 1 }
          }
        ]
      });

      function applySelection(story) {
        selectedStory = story;
        chart.setOption({ series: [{}, { data: selectedPoint(story) }] });
        chart.dispatchAction({ type: "downplay", seriesIndex: 0 });
        chart.dispatchAction({ type: "highlight", seriesIndex: 0, dataIndex: story - 1 });
      }

      function emitSelection(story) {
        window.ipc.postMessage(JSON.stringify({ version: 1, type: "select_story", story }));
      }

      window.hostBridge = Object.freeze({
        selectedStory: () => selectedStory,
        receive(message) {
          if (
            message &&
            message.version === 1 &&
            message.type === "select_story" &&
            Number.isInteger(message.story) &&
            message.story >= 1 &&
            message.story <= rows.length
          ) {
            applySelection(message.story);
          }
        }
      });
      window.__stageMarker = "bridge_installed";

      chart.on("click", (params) => {
        const story = params && params.data && params.data.story;
        if (Number.isInteger(story) && story >= 1 && story <= rows.length) {
          emitSelection(story);
        }
      });

      element.addEventListener("keydown", (event) => {
        const delta = event.key === "ArrowUp" ? 1 : event.key === "ArrowDown" ? -1 : 0;
        if (delta !== 0) {
          event.preventDefault();
          const story = Math.max(1, Math.min(rows.length, selectedStory + delta));
          if (story !== selectedStory) {
            emitSelection(story);
          }
        }
      });

      window.addEventListener("resize", () => chart.resize());
      applySelection(selectedStory);
      window.ipc.postMessage(JSON.stringify({ version: 1, type: "chart_ready" }));
    })();
  </script>
</body>
</html>
