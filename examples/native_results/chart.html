<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; font-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'">
<style>*{box-sizing:border-box}html,body{width:100%;height:100%;min-width:0;min-height:0;margin:0;overflow:hidden;background:#121923;color:#d4dde8;font:13px sans-serif}body{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:repeat(2,minmax(0,1fr))}.plot{min-width:0;min-height:0;overflow:hidden}.plot:focus{outline:1px solid #64dfc5;outline-offset:-1px}</style></head>
<body><div class="plot" id="drift" tabindex="0"></div><div class="plot" id="shear" tabindex="0"></div>
<script>/*__ECHARTS_RUNTIME__*/</script><script>
"use strict";
const charts={drift:echarts.init(document.getElementById('drift'),'dark'),shear:echarts.init(document.getElementById('shear'),'dark')};let active=null;
function markers(packet,kind){const p=packet[kind];return [...(p.reference===null?[]:[{name:'Stored allowable ratio',xAxis:p.reference}]),...(packet.selected_story!==null&&p.stories.includes(packet.selected_story)?[{name:'Selected story',yAxis:packet.selected_story,lineStyle:{color:'#64dfc5',width:2}}]:[])];}
function option(packet,kind){const p=packet[kind];return {animation:false,backgroundColor:'#121923',title:{text:p.title+' ('+p.unit+')',left:12,top:8,textStyle:{fontSize:13,width:Math.max(80,charts[kind].getWidth()-24),overflow:'truncate'}},legend:{type:'scroll',left:12,right:12,bottom:4},tooltip:{trigger:'axis',confine:true,renderMode:'richText'},grid:{left:120,right:64,top:48,bottom:58},xAxis:{type:'value',...(p.reference===null?{}:{max:extent=>Math.max(extent.max,p.reference)})},yAxis:{type:'category',data:p.stories,inverse:true,axisLabel:{width:88,overflow:'truncate'}},dataZoom:[{type:'inside',yAxisIndex:0,filterMode:'none'},{type:'slider',yAxisIndex:0,right:12,width:12,filterMode:'none'}],series:p.series.map((s,i)=>({name:s.name,type:'line',symbolSize:4,connectNulls:false,data:p.stories.map((story,j)=>[s.values[j],story]),...(i===0?{markLine:{silent:true,symbol:'none',label:{position:'insideEndTop',fontSize:10},data:markers(packet,kind)}}:{})}))};}
window.resultBridge=Object.freeze({apply(packet){if(packet.version!==1||typeof packet.source!=='string')throw Error('Invalid cached packet');if(active&&packet.source===active.source&&packet.generation<active.generation)return;const same=active&&packet.source===active.source&&packet.generation===active.generation;active=packet;for(const kind of ['drift','shear']){if(same)charts[kind].setOption({series:[{markLine:{data:markers(packet,kind)}}]});else charts[kind].setOption(option(packet,kind),{notMerge:true});}}});
for(const kind of ['drift','shear']){charts[kind].on('click',p=>{if(active&&p.componentType==='series'&&Array.isArray(p.value)&&active[kind].stories.includes(p.value[1]))window.ipc.postMessage(JSON.stringify({version:1,type:'select_story',source:active.source,generation:active.generation,plot:kind,story:p.value[1]}));});document.getElementById(kind).addEventListener('keydown',e=>{if(e.key==='Escape'&&active){window.ipc.postMessage(JSON.stringify({version:1,type:'clear_selection',source:active.source,generation:active.generation,plot:kind,story:null}));e.preventDefault();}});}
new ResizeObserver(()=>{for(const chart of Object.values(charts)){chart.resize();chart.setOption({title:{textStyle:{width:Math.max(80,chart.getWidth()-24)}}});}}).observe(document.body);window.ipc.postMessage(JSON.stringify({version:1,type:'results_ready'}));
</script></body></html>
